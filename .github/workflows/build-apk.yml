name: Build ManhwaReader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ManhwaReader-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and build
        run: |
          unzip -q ManhwaReader-project.zip
          cd ManhwaReader
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaReader-APK
          path: ManhwaReader/app/build/outputs/apk/debug/app-debug.apk
